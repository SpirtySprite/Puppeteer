    - "<muted>┃</muted> <text>Skin :</text> <secondary><skin>"
    - "<muted>┃</muted> <text>Style du nom :</text> <secondary><style>"
    - "<muted>┃</muted> <text>Actions :</text> <secondary><left></secondary> gauche, <secondary><right></secondary> droit, <secondary><both></secondary> les deux"
