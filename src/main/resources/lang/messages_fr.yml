  invalid-type: "<prefix><error><cross></error> <text><text><type></text> n'est pas un type d'entité vivante."
  created: "<prefix><success><check></success> <text>PNJ <secondary><id></secondary> créé à votre position. Personnalisez-le dans npcs.yml puis faites <primary>/npc reload</primary>."
  deleted: "<prefix><success><check></success> <text>PNJ <secondary><id></secondary> supprimé."
  moved: "<prefix><success><check></success> <text>PNJ <secondary><id></secondary> déplacé à votre position."
  renamed: "<prefix><success><check></success> <text>PNJ <secondary><id></secondary> renommé en <text><name></text>."
