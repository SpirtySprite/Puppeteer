general:
  no-permission: "<prefix><error><cross></error> <text>Vous n'avez pas la permission de faire cela."
  players-only: "<prefix><error><cross></error> <text>Seuls les joueurs peuvent utiliser cette commande."
  update-available: "<prefix><primary>✦</primary> <text><plugin> <secondary><version></secondary> <text>est disponible <muted>(installée : <current>)</muted> <link>"
npc:
