  import-missing: "<prefix><error><cross></error> <text>Dossier de <secondary><plugin></secondary> introuvable : <muted><folder>"
  import-started: "<prefix><secondary>⌛</secondary> <text>Import depuis <secondary><plugin></secondary> en cours..."
