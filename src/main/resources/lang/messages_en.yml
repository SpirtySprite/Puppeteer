style-version: 2
prefix: "<gradient:#8B5CF6:#22D3EE><b>ᴘᴜᴘᴘᴇᴛᴇᴇʀ</b></gradient> <muted>▸</muted> "
general:
  no-permission: "<prefix><error><cross></error> <text>You don't have permission to do that."
  players-only: "<prefix><error><cross></error> <text>Only players can use this command."
npc:
  unavailable: "<prefix><error><cross></error> <text>The NPC system is unavailable on this server, check the console."
  usage: "<prefix><secondary>⌨</secondary> <muted>ᴄᴏᴍᴍᴀɴᴅ</muted> <primary>/npc <reload|list|info|create|delete|movehere|tp|rename|skin|copy|enable|disable|stats> <muted>| <primary>/npc create <npc> [type] <muted>| <primary>/npc skin <npc> <player|url|mirror|none> <muted>| <primary>/npc copy <npc> <new>"
  reloaded: "<prefix><success><check></success> <text>NPCs reloaded <muted><pipe></muted> <text><active></text> <muted>active,</muted> <text><spawned></text> <muted>added,</muted> <text><respawned></text> <muted>updated,</muted> <text><removed></text> <muted>removed,</muted> <text><kept></text> <muted>unchanged, of which</muted> <text><restyled></text> <muted>had their name style adjusted"
  pending: "<prefix><warning>⚠</warning> <text><count> NPCs are waiting for their world to load, they will appear on their own."
  warnings: "<prefix><warning>⚠</warning> <text><count> warnings in npcs.yml:"
  warning: "<muted>┃</muted> <warning>⚠</warning> <text><warning>"
  unknown: "<prefix><error><cross></error> <text>No NPC named <text><id></text> exists."
  exists: "<prefix><error><cross></error> <text>The NPC <secondary><id></secondary> already exists."
  invalid-id: "<prefix><error><cross></error> <text><text><id></text> is not a valid identifier. Lowercase letters, digits, _ and - only, 32 characters at most."
  invalid-type: "<prefix><error><cross></error> <text><text><type></text> is not a living entity type."
  created: "<prefix><success><check></success> <text>NPC <secondary><id></secondary> created at your position. Customize it in npcs.yml then run <primary>/npc reload</primary>."
  deleted: "<prefix><success><check></success> <text>NPC <secondary><id></secondary> deleted."
  moved: "<prefix><success><check></success> <text>NPC <secondary><id></secondary> moved to your position."
  renamed: "<prefix><success><check></success> <text>NPC <secondary><id></secondary> renamed to <text><name></text>."
  skin-set: "<prefix><success><check></success> <text>Skin of <secondary><id></secondary> set to <text><skin></text>."
  skin-cleared: "<prefix><success><check></success> <text>Skin of <secondary><id></secondary> removed."
  copied: "<prefix><success><check></success> <text><secondary><id></secondary> copied as <secondary><copy></secondary> at your position."
  enabled: "<prefix><success><check></success> <text>NPC <secondary><id></secondary> enabled."
  disabled: "<prefix><warning>⚠</warning> <text>NPC <secondary><id></secondary> disabled."
  teleported: "<prefix><success><check></success> <text>You joined the NPC <secondary><id></secondary>."
  world-missing: "<prefix><error><cross></error> <text>The world <text><world></text> is not loaded."
  denied: "<prefix><error><cross></error> <text>You don't have permission to use this NPC."
  no-money: "<prefix><error><cross></error> <text>You need <money><amount></money> for that."
  list-empty: "<prefix><muted>◇</muted> <text>No NPC is configured. Create one with <primary>/npc create <name>"
  list-header: "<prefix><primary>✦</primary> <text><b>NPCs</b> <muted>(<active> active out of <count>)"
  list-entry: "<muted>┃</muted> <click:suggest_command:'/npc info <id>'><hover:show_text:'<text>Show details'><secondary><id></secondary></hover></click> <muted>▸</muted> <status> <muted>▸</muted> <text><type></text> <muted>▸</muted> <text><position>"
  status:
    active: "<success>active"
    pending: "<warning>world missing"
    disabled: "<muted>disabled"
    unknown: "<error>invalid"
  info:
    - "<primary><b>✦ ɴᴘᴄ <id></b></primary> <muted>▸</muted> <status>"
    - "<muted>┃</muted> <text>Name:</text> <secondary><name>"
    - "<muted>┃</muted> <text>Type:</text> <secondary><type>"
    - "<muted>┃</muted> <text>Position:</text> <secondary><position>"
    - "<muted>┃</muted> <text>Skin:</text> <secondary><skin>"
    - "<muted>┃</muted> <text>Name style:</text> <secondary><style>"
    - "<muted>┃</muted> <text>Actions:</text> <secondary><left></secondary> left, <secondary><right></secondary> right, <secondary><both></secondary> both"
    - "<muted>┃</muted> <text>Click cooldown:</text> <secondary><cooldown> ms"
    - "<muted>┃</muted> <text>View permission:</text> <secondary><permission>"
  stats:
    - "<primary><b>✦ ɴᴘᴄ</b></primary> <muted>▸</muted> <text>statistics"
    - "<muted>┃</muted> <text>Active:</text> <success><active></success> <muted>▸ waiting:</muted> <warning><pending></warning> <muted>▸ disabled:</muted> <text><disabled>"
    - "<muted>┃</muted> <text>Current views:</text> <secondary><shows>"
    - "<muted>┃</muted> <text>Packets sent:</text> <secondary><packets>"
    - "<muted>┃</muted> <text>Last cycle:</text> <secondary><tick> ms"
    - "<muted>┃</muted> <text>Missing features:</text> <secondary><missing>"
    - "<muted>┃</muted> <text>Warnings:</text> <warning><warnings>"

logs:
  prefix: "<gradient:#F87171:#A78BFA><b>ʟᴏɢs</b></gradient> <muted>▸</muted> "
  alert: "<logs><icon> <muted><topic></muted> <muted>┃</muted> <text><title><muted>:</muted> <text><summary> <muted>[<secondary>ᴅᴇᴛᴀɪʟs</secondary><muted>]"
