name: Puppeteer
version: '${project.version}'
main: com.kirugoldzzzz.puppeteer.Puppeteer
api-version: '1.21'
folia-supported: true
author: KiruGoldzZz
description: "Packet-based, configurable NPCs for Paper and Folia"
softdepend: [PlaceholderAPI, Vault]
commands:
  npc:
    description: Manage NPCs
    usage: /npc <reload|list|info|create|delete|movehere|tp|rename|skin|copy|enable|disable|stats>
    permission: puppeteer.admin.npc
    aliases: [npcs, pnj]
permissions:
  puppeteer.admin.npc:
    description: Create, edit and reload NPCs
    default: op
