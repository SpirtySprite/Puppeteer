name: Puppeteer
version: '${project.version}'
main: com.kirugoldzzzz.puppeteer.Puppeteer
api-version: '1.21'
folia-supported: true
author: KiruGoldzZz
description: "PNJ configurables pour Paper et Folia"
softdepend: [PlaceholderAPI, Vault]
commands:
  npc:
    description: Gérer les PNJ
    usage: /npc <reload|list|info|create|delete|movehere|tp|rename|skin|copy|enable|disable|stats>
    permission: puppeteer.admin.npc
    aliases: [npcs, pnj]
permissions:
  puppeteer.admin.npc:
    description: Créer, modifier et recharger les PNJ
    default: op
