settings:
  view-distance: 48
  default-cooldown-ms: 500
  skin-cache-minutes: 30
  debug: false
  nametag-style:
    background: "#000000"
    background-opacity: 25
    text-opacity: 100
    shadow: false
    see-through: false

npcs:
  guide:
    enabled: false
    name: Guide
    type: PLAYER
    location:
      world: world
      x: 0.5
      y: 64.0
      z: 0.5
      yaw: 180.0
      pitch: 0.0
    skin: Notch
    nametag:
      - "<gradient:#8a5cff:#35d0ff><b>GUIDE DU SERVEUR</b></gradient>"
      - "<muted>Bienvenue <text>%player%"
      - "<muted>Clic droit pour découvrir le serveur"
    nametag-style:
      background-opacity: 0
      shadow: true
    look-at-players: true
    cooldown-ms: 1000
    appearance:
      glowing: true
      glow-color: aqua
      skin-layers: true
      scale: 1.0
      collidable: true
      show-in-tab: false
    equipment:
      hand: COMPASS
      off-hand:
        material: BOOK
        glow: true
    actions:
      - click: RIGHT
        type: SWING
      - click: RIGHT
        type: TITLE
        value: "<gradient:#8a5cff:#35d0ff><b>BIENVENUE</b></gradient>"
        subtitle: "<muted>Bonne aventure <text>%player%"
        fade-in: 10
        duration: 60
        fade-out: 20
      - click: RIGHT
        type: SOUND
        value: entity.player.levelup
        volume: 0.8
        pitch: 1.3
      - click: RIGHT
        type: MESSAGE
        delay: 20
        value:
          - "<primary><b>Guide</b> <muted><pipe></muted> <text>Voici les commandes utiles :"
          - "<muted> <arrow> <primary>/rtp</primary> <text>pour partir à l'aventure"
          - "<muted> <arrow> <primary>/shop</primary> <text>pour acheter et vendre"
          - "<muted> <arrow> <primary>/team</primary> <text>pour jouer à plusieurs"
      - click: LEFT
        type: ACTIONBAR
        value: "<muted>Faites plutôt un <primary>clic droit</primary> pour me parler"
      - click: BOTH
        sneak: true
        type: PLAYER_COMMAND
        value: /spawn

  banquier:
    enabled: false
    name: Banquier
    type: VILLAGER
    location:
      world: world
      x: 4.5
      y: 64.0
      z: 0.5
      yaw: 90.0
      pitch: 0.0
    nametag:
      - "&6&lBANQUIER"
      - "&7Solde : &e%vault_eco_balance_formatted%"
      - "&7Un coup de pouce contre &e250"
    nametag-refresh-ticks: 40
    nametag-style:
      background: "#2B1A00"
      background-opacity: 60
    cooldown-ms: 3000
    villager:
      profession: librarian
      type: plains
      level: 5
    appearance:
      scale: 1.1
    actions:
      - click: RIGHT
        type: TAKE_MONEY
        amount: 250
        value: "<success>Transaction acceptée, profitez de votre élan !"
        deny-message: "<error>Revenez avec au moins <money>250</money> en poche."
      - click: RIGHT
        type: EFFECT
        value: speed
        amount: 2
        duration: 600
      - click: RIGHT
        type: EFFECT
        value: haste
        amount: 1
        duration: 600
        delay: 10
      - click: RIGHT
        type: PARTICLE
        value: HAPPY_VILLAGER
        amount: 30
      - click: RIGHT
        type: SOUND
        value: ENTITY_VILLAGER_YES
      - click: LEFT
        type: MESSAGE
        value: "<muted>Solde actuel : <money>%vault_eco_balance_formatted%"

  passeur:
    enabled: false
    name: Passeur
    type: PLAYER
    location:
      world: world
      x: -4.5
      y: 64.0
      z: 0.5
      yaw: -90.0
      pitch: 0.0
    skin: mirror
    permission: puppeteer.passeur
    nametag:
      - "<secondary><b>PASSEUR</b>"
      - "<muted>Réservé aux membres VIP"
    nametag-style:
      background: dark_purple
      background-opacity: 35
      text-opacity: 85
      see-through: true
    look-at-players: true
    appearance:
      glowing: true
      glow-color: light_purple
    pose: CROUCHING
    equipment:
      head:
        material: GOLDEN_HELMET
        glow: true
      chest: NETHERITE_CHESTPLATE
    actions:
      - click: BOTH
        type: REQUIRE_PERMISSION
        value: puppeteer.passeur
        deny-message: "<error>Seuls les VIP peuvent traverser."
      - click: RIGHT
        sneak: false
        type: TELEPORT
        value: "world 250 80 250 0 0"
      - click: RIGHT
        sneak: false
        type: BROADCAST
        value: "<secondary><b>Passeur</b> <muted><pipe></muted> <text>%player% part explorer les terres lointaines."
      - click: RIGHT
        sneak: true
        type: SERVER
        value: lobby
      - click: LEFT
        type: CONSOLE_COMMAND
        value: "give %player% minecraft:ender_pearl 1"
        permission: puppeteer.passeur.bonus
        deny-message: "<muted>Le bonus est réservé aux VIP+"
      - click: LEFT
        type: GIVE_MONEY
        amount: 50
        value: "<success>+<money>50</money> pour votre visite."
        delay: 5

  mascotte:
    enabled: false
    name: Mascotte
    type: CAT
    location:
      world: world
      x: 0.5
      y: 64.0
      z: 4.5
      yaw: 0.0
      pitch: 0.0
    variant: black
    baby: true
    nametag:
      - "<primary>Minuit"
    nametag-refresh-ticks: 0
    view-distance: 24
    look-at-players: false
    appearance:
      nametag-visible: true
      collidable: false
    actions:
      - click: RIGHT
        type: SOUND
        value: entity.cat.purreow
        pitch: 1.4
      - click: RIGHT
        type: PARTICLE
        value: HEART
        amount: 6
