settings:
  view-distance: 48
  default-cooldown-ms: 500
  skin-cache-minutes: 30
  debug: false
  nametag-style:
    background: "#000000"
    background-opacity: 25
    text-opacity: 100
    shadow: false
    see-through: false

npcs:
  guide:
    enabled: false
    name: Guide
    type: PLAYER
    location:
      world: world
      x: 0.5
      y: 64.0
      z: 0.5
      yaw: 180.0
      pitch: 0.0
    skin: Notch
    nametag:
      - "<gradient:#8a5cff:#35d0ff><b>SERVER GUIDE</b></gradient>"
      - "<muted>Welcome <text>%player%"
      - "<muted>Right click to discover the server"
    nametag-style:
      background-opacity: 0
      shadow: true
    look-at-players: true
    cooldown-ms: 1000
    appearance:
      glowing: true
      glow-color: aqua
      skin-layers: true
      scale: 1.0
      collidable: true
      show-in-tab: false
    equipment:
      hand: COMPASS
      off-hand:
        material: BOOK
        glow: true
    actions:
      - click: RIGHT
        type: SWING
      - click: RIGHT
        type: TITLE
        value: "<gradient:#8a5cff:#35d0ff><b>WELCOME</b></gradient>"
        subtitle: "<muted>Have a great adventure <text>%player%"
        fade-in: 10
        duration: 60
        fade-out: 20
      - click: RIGHT
        type: SOUND
        value: entity.player.levelup
        volume: 0.8
        pitch: 1.3
      - click: RIGHT
        type: MESSAGE
        delay: 20
        value:
          - "<primary><b>Guide</b> <muted><pipe></muted> <text>Here are the useful commands:"
          - "<muted> <arrow> <primary>/rtp</primary> <text>to head out on an adventure"
          - "<muted> <arrow> <primary>/shop</primary> <text>to buy and sell"
          - "<muted> <arrow> <primary>/team</primary> <text>to play with friends"
      - click: LEFT
        type: ACTIONBAR
        value: "<muted>Use a <primary>right click</primary> to talk to me instead"
      - click: BOTH
        sneak: true
        type: PLAYER_COMMAND
        value: /spawn

  banker:
    enabled: false
    name: Banker
    type: VILLAGER
    location:
      world: world
      x: 4.5
      y: 64.0
      z: 0.5
      yaw: 90.0
      pitch: 0.0
    nametag:
      - "&6&lBANQUIER"
      - "&7Balance: &e%vault_eco_balance_formatted%"
      - "&7A little boost for &e250"
    nametag-refresh-ticks: 40
    nametag-style:
      background: "#2B1A00"
      background-opacity: 60
    cooldown-ms: 3000
    villager:
      profession: librarian
      type: plains
      level: 5
    appearance:
      scale: 1.1
    actions:
      - click: RIGHT
        type: TAKE_MONEY
        amount: 250
        value: "<success>Transaction accepted, enjoy the boost!"
        deny-message: "<error>Come back with at least <money>250</money> in your pocket."
      - click: RIGHT
        type: EFFECT
        value: speed
        amount: 2
        duration: 600
      - click: RIGHT
        type: EFFECT
        value: haste
        amount: 1
        duration: 600
        delay: 10
      - click: RIGHT
        type: PARTICLE
        value: HAPPY_VILLAGER
        amount: 30
      - click: RIGHT
        type: SOUND
        value: ENTITY_VILLAGER_YES
      - click: LEFT
        type: MESSAGE
        value: "<muted>Current balance: <money>%vault_eco_balance_formatted%"

  ferryman:
    enabled: false
    name: Ferryman
    type: PLAYER
    location:
      world: world
      x: -4.5
      y: 64.0
      z: 0.5
      yaw: -90.0
      pitch: 0.0
    skin: mirror
    permission: puppeteer.ferryman
    nametag:
      - "<secondary><b>FERRYMAN</b>"
      - "<muted>VIP members only"
    nametag-style:
      background: dark_purple
      background-opacity: 35
      text-opacity: 85
      see-through: true
    look-at-players: true
    appearance:
      glowing: true
      glow-color: light_purple
    pose: CROUCHING
    equipment:
      head:
        material: GOLDEN_HELMET
        glow: true
      chest: NETHERITE_CHESTPLATE
    actions:
      - click: BOTH
        type: REQUIRE_PERMISSION
        value: puppeteer.ferryman
        deny-message: "<error>Only VIPs can cross."
      - click: RIGHT
        sneak: false
        type: TELEPORT
        value: "world 250 80 250 0 0"
      - click: RIGHT
        sneak: false
        type: BROADCAST
        value: "<secondary><b>Ferryman</b> <muted><pipe></muted> <text>%player% sets off to explore distant lands."
      - click: RIGHT
        sneak: true
        type: SERVER
        value: lobby
      - click: LEFT
        type: CONSOLE_COMMAND
        value: "give %player% minecraft:ender_pearl 1"
        permission: puppeteer.ferryman.bonus
        deny-message: "<muted>The bonus is for VIP+ only"
      - click: LEFT
        type: GIVE_MONEY
        amount: 50
        value: "<success>+<money>50</money> for your visit."
        delay: 5

  mascot:
    enabled: false
    name: Mascot
    type: CAT
    location:
      world: world
      x: 0.5
      y: 64.0
      z: 4.5
      yaw: 0.0
      pitch: 0.0
    variant: black
    baby: true
    nametag:
      - "<primary>Midnight"
    nametag-refresh-ticks: 0
    view-distance: 24
    look-at-players: false
    appearance:
      nametag-visible: true
      collidable: false
    patrol:
      speed: 0.8
      pause-ticks: 60
      points:
        - "4.5 64 4.5"
        - "4.5 64 0.5"
    actions:
      - click: RIGHT
        type: SOUND
        value: entity.cat.purreow
        pitch: 1.4
      - click: RIGHT
        type: PARTICLE
        value: HEART
        amount: 6
      - click: LEFT
        type: DIALOGUE
        value:
          - "<primary>Midnight</primary> <text>stretches and yawns."
          - "<primary>Midnight</primary> <text>rubs against your legs."
          - "<primary>Midnight</primary> <text>looks at you, then walks away."
      - click: LEFT
        sneak: true
        type: CONSOLE_COMMAND
        once: true
        value: "give %player% cod 3"
